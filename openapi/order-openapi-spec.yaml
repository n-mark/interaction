openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
  description: |
    HTTP API сервиса заказов.
servers:
  - url: http://order-service

tags:
  - name: orders

paths:
  /order:
    post:
      tags: [orders]
      summary: Создать заказ
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              simple:
                value:
                  total_price: 100
      responses:
        '201':
          description: Заказ создан (изначально в статусе PENDING/PAYMENT_PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /order/{orderId}:
    get:
      tags: [orders]
      summary: Получить заказ по идентификатору
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      schema: { type: string }
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, format: uuid }

  schemas:
    CreateOrderRequest:
      type: object
      required: [total_price]
      properties:
        total_price:
          type: number
          minimum: 0
          description: Сумма заказа.

    OrderStatus:
      type: string
      enum:
        - PENDING
        - PAYMENT_PENDING
        - SUCCESSFULLY_PAID
        - PAYMENT_FAILED
        - PAYMENT_REQUIRED

    OrderCreatedResponse:
      type: object
      required: [order_id, status]
      properties:
        order_id: { type: string }
        status:   { $ref: '#/components/schemas/OrderStatus' }

    Order:
      type: object
      required: [order_id, user_id, status, total_price]
      properties:
        order_id:      { type: string }
        user_id:       { type: string }
        status:        { $ref: '#/components/schemas/OrderStatus' }
        total_price:   { type: number, minimum: 0 }

    Error:
      type: object
      required: [code, message]
      properties:
        code:    { type: string }
        message: { type: string }

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Пользователь не аутентифицирован
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
