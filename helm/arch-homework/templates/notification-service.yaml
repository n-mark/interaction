apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: {{ include "arch.namespace" . }}
data:
  BROKER_TYPE: "RABBITMQ"
  PG_HOST: "postgres-notification.{{ include "arch.namespace" . }}.svc.cluster.local"
  PG_PORT: "5432"
  PG_DATABASE: {{ .Values.postgresNotification.database | quote }}
  PG_SSLMODE: "disable"
  RABBIT_HOST: "rabbitmq.{{ include "arch.namespace" . }}.svc.cluster.local"
  RABBIT_PORT: {{ .Values.rabbitmq.amqpPort | quote }}
  APP_PORT: "{{ .Values.notification.port }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secret
  namespace: {{ include "arch.namespace" . }}
type: Opaque
stringData:
  PG_USER: {{ .Values.postgresNotification.user | quote }}
  PG_PASSWORD: {{ .Values.postgresNotification.password | quote }}
  RABBIT_USERNAME: {{ .Values.rabbitmq.user | quote }}
  RABBIT_PASSWORD: {{ .Values.rabbitmq.password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ include "arch.namespace" . }}
  labels:
    app: notification-service
spec:
  replicas: {{ .Values.notification.replicas }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-notification.{{ include "arch.namespace" . }}.svc.cluster.local 5432; do
                echo "waiting for postgres-notification..."; sleep 2;
              done
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq.{{ include "arch.namespace" . }}.svc.cluster.local {{ .Values.rabbitmq.amqpPort }}; do
                echo "waiting for rabbitmq..."; sleep 2;
              done
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
      containers:
        - name: notification-service
          image: "{{ .Values.image.notification.repository }}:{{ .Values.image.notification.tag }}"
          imagePullPolicy: {{ .Values.image.notification.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.notification.port }}
          envFrom:
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: notification-service-secret
          # readinessProbe:
          #   httpGet: { path: /health, port: http }
          #   initialDelaySeconds: 5
          #   periodSeconds: 5
          # livenessProbe:
          #   httpGet: { path: /health, port: http }
          #   initialDelaySeconds: 15
          #   periodSeconds: 10
          resources:
{{ toYaml .Values.notification.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: {{ include "arch.namespace" . }}
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.notification.port }}
      protocol: TCP
