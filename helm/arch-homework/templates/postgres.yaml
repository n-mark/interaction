apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ include "arch.namespace" . }}
data:
  001-create-databases.sql: |
    CREATE DATABASE {{ .Values.postgres.profileDB }};
  002-users-schema.sql: |
    \connect {{ .Values.postgres.defaultDB }}
    CREATE TABLE IF NOT EXISTS users (
      id            SERIAL PRIMARY KEY,
      username      VARCHAR(255) NOT NULL UNIQUE,
      password_hash VARCHAR(255) NOT NULL DEFAULT '',
      email         VARCHAR(255) NOT NULL DEFAULT '',
      phone         VARCHAR(50)  NOT NULL DEFAULT '',
      created_at    TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at    TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    CREATE INDEX IF NOT EXISTS idx_users_username ON users(username);
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
  003-profile-schema.sql: |
    \connect {{ .Values.postgres.profileDB }}
    CREATE TABLE IF NOT EXISTS profile (
      profile_id    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      userid        bigint NOT NULL,
      name          varchar(255),
      surname       varchar(255),
      date_of_birth timestamp,
      gender        varchar(20),
      city          varchar(255),
      bio           text,
      interests     text,
      CONSTRAINT uq_user UNIQUE (userid)
    );
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ include "arch.namespace" . }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.defaultDB | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ include "arch.namespace" . }}
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ include "arch.namespace" . }}
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: pg
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
