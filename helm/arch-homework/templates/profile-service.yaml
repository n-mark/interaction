apiVersion: v1
kind: ConfigMap
metadata:
  name: profile-service-config
  namespace: {{ include "arch.namespace" . }}
data:
  DB_HOST: "postgres-profile.{{ include "arch.namespace" . }}.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgresProfile.database | quote }}
  SERVER_ADDR: ":{{ .Values.profile.port }}"
  RABBIT_HOST: "rabbitmq.{{ include "arch.namespace" . }}.svc.cluster.local"
  RABBIT_PORT: "{{ .Values.rabbitmq.amqpPort }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: profile-service-secret
  namespace: {{ include "arch.namespace" . }}
type: Opaque
stringData:
  DB_USER: {{ .Values.postgresProfile.user | quote }}
  DB_PASSWORD: {{ .Values.postgresProfile.password | quote }}
  RABBIT_USERNAME: {{ .Values.rabbitmq.user | quote }}
  RABBIT_PASSWORD: {{ .Values.rabbitmq.password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  namespace: {{ include "arch.namespace" . }}
  labels:
    app: profile-service
spec:
  replicas: {{ .Values.profile.replicas }}
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-profile.{{ include "arch.namespace" . }}.svc.cluster.local 5432; do
                echo "waiting for postgres-profile..."; sleep 2;
              done
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq.{{ include "arch.namespace" . }}.svc.cluster.local {{ .Values.rabbitmq.amqpPort }}; do
                echo "waiting for rabbitmq..."; sleep 2;
              done
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
      containers:
        - name: profile-service
          image: "{{ .Values.image.profile.repository }}:{{ .Values.image.profile.tag }}"
          imagePullPolicy: {{ .Values.image.profile.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.profile.port }}
          envFrom:
            - configMapRef:
                name: profile-service-config
            - secretRef:
                name: profile-service-secret
          # readinessProbe:
          #   httpGet: { path: /health, port: http }
          #   initialDelaySeconds: 5
          #   periodSeconds: 5
          # livenessProbe:
          #   httpGet: { path: /health, port: http }
          #   initialDelaySeconds: 15
          #   periodSeconds: 10
          resources:
{{ toYaml .Values.profile.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: {{ include "arch.namespace" . }}
spec:
  selector:
    app: profile-service
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.profile.port }}
      protocol: TCP
