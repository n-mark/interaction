apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth
  namespace: {{ include "arch.namespace" . }}
spec:
  forwardAuth:
    address: http://auth-service.{{ include "arch.namespace" . }}.svc.cluster.local/validate
    trustForwardHeader: true
    authResponseHeaders:
      - X-User-Id
---
# Adds /api/v1 to the request path before proxying to the upstream service,
# so that external clients call /notifications while the service sees /api/v1/notifications.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-api-prefix
  namespace: {{ include "arch.namespace" . }}
spec:
  addPrefix:
    prefix: /api/v1
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: arch-homework
  namespace: {{ include "arch.namespace" . }}
spec:
  entryPoints:
    - {{ .Values.traefik.entryPoint }}
  routes:
    # Public auth endpoints (no forward-auth middleware)
    - match: Host(`{{ include "arch.host" . }}`) && (PathPrefix(`/register`) || PathPrefix(`/login`) || PathPrefix(`/auth`))
      kind: Rule
      services:
        - name: auth-service
          port: 80
    # Authenticated application services
    - match: Host(`{{ include "arch.host" . }}`) && PathPrefix(`/profile`)
      kind: Rule
      services:
        - name: profile-service
          port: 80
      middlewares:
        - name: forward-auth
          namespace: {{ include "arch.namespace" . }}
    - match: Host(`{{ include "arch.host" . }}`) && PathPrefix(`/billing`)
      kind: Rule
      services:
        - name: billing-service
          port: 80
      middlewares:
        - name: forward-auth
          namespace: {{ include "arch.namespace" . }}
        - name: add-api-prefix
          namespace: {{ include "arch.namespace" . }}
    - match: Host(`{{ include "arch.host" . }}`) && PathPrefix(`/order`)
      kind: Rule
      services:
        - name: order-service
          port: 80
      middlewares:
        - name: forward-auth
          namespace: {{ include "arch.namespace" . }}
        - name: add-api-prefix
          namespace: {{ include "arch.namespace" . }}
    - match: Host(`{{ include "arch.host" . }}`) && PathPrefix(`/notifications`)
      kind: Rule
      services:
        - name: notification-service
          port: 80
      middlewares:
        - name: forward-auth
          namespace: {{ include "arch.namespace" . }}
        - name: add-api-prefix
          namespace: {{ include "arch.namespace" . }}
