apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: {{ include "arch.namespace" . }}
data:
  BROKER_TYPE: "RABBITMQ"
  PG_HOST: "postgres-order.{{ include "arch.namespace" . }}.svc.cluster.local"
  PG_PORT: "5432"
  PG_DATABASE: {{ .Values.postgresOrder.database | quote }}
  PG_SSLMODE: "disable"
  RABBIT_HOST: "rabbitmq.{{ include "arch.namespace" . }}.svc.cluster.local"
  RABBIT_PORT: {{ .Values.rabbitmq.amqpPort | quote }}
  # Exchange this service publishes to (consumed by billing-svc / notification-svc)
  RABBIT_ORDER_EXCHANGE: "order"
  RABBIT_ORDER_CREATED_ROUTING_KEY: "order.created"
  RABBIT_ORDER_UPDATED_ROUTING_KEY: "order.updated"
  # Exchange this service consumes from (produced by billing-svc)
  RABBIT_BILLING_EXCHANGE: "billing"
  RABBIT_BILLING_CONSUMER: "ordersvc.consumer.for.billing.payment"
  RABBIT_BILLING_CONSUMER_ROUTING_KEY: "billing.payment.*"
  APP_PORT: "{{ .Values.order.port }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
  namespace: {{ include "arch.namespace" . }}
type: Opaque
stringData:
  PG_USER: {{ .Values.postgresOrder.user | quote }}
  PG_PASSWORD: {{ .Values.postgresOrder.password | quote }}
  RABBIT_USERNAME: {{ .Values.rabbitmq.user | quote }}
  RABBIT_PASSWORD: {{ .Values.rabbitmq.password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: {{ include "arch.namespace" . }}
  labels:
    app: order-service
spec:
  replicas: {{ .Values.order.replicas }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-order.{{ include "arch.namespace" . }}.svc.cluster.local 5432; do
                echo "waiting for postgres-order..."; sleep 2;
              done
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq.{{ include "arch.namespace" . }}.svc.cluster.local {{ .Values.rabbitmq.amqpPort }}; do
                echo "waiting for rabbitmq..."; sleep 2;
              done
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
      containers:
        - name: order-service
          image: "{{ .Values.image.order.repository }}:{{ .Values.image.order.tag }}"
          imagePullPolicy: {{ .Values.image.order.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.order.port }}
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-secret
          # readinessProbe:
          #   httpGet: { path: /health, port: http }
          #   initialDelaySeconds: 5
          #   periodSeconds: 5
          # livenessProbe:
          #   httpGet: { path: /health, port: http }
          #   initialDelaySeconds: 15
          #   periodSeconds: 10
          resources:
{{ toYaml .Values.order.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ include "arch.namespace" . }}
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.order.port }}
      protocol: TCP
